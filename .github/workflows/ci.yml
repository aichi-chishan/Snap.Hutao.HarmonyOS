name: CI

# HarmonyOS lint/build 依赖华为 Command Line Tools（华为开发者站需登录下载，无公开直链）。
# 在仓库 Settings → Secrets and variables → Actions → Variables 配置
#   DEVECO_CLT_URL = CLT zip 直链（如 DevEco-Command-Line-Tools-linux-x64.zip 的下载地址）
# 后本工作流自动启用；未配置时两个 job 跳过（不阻塞 PR）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  meta:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check invariants
        run: |
          test -f ci/build-profile.ci.json5
          test -f docs/TESTING.md
          test -f entry/src/test/LogicUnitTest.test.ets
          grep -q "logicUnitTest()" entry/src/test/List.test.ets
          grep -q "logicUnitTest" entry/src/test/List.test.ets
          # 隐私回归门禁：文档不得含本机用户名/QQ 邮箱（历史曾泄露，已清洗）
          if grep -rn -E "27415|2741559686@qq\.com" --include="*.md" .; then
            echo "::error::Privacy regression: personal info in markdown"
            exit 1
          fi
          echo "invariants ok"

  lint:
    name: Lint (0 errors gate)
    runs-on: ubuntu-latest
    if: ${{ vars.DEVECO_CLT_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DevEco CLI
        run: npm install -g @deveco/deveco-cli
      - name: Install Command Line Tools
        run: |
          curl -L --fail --retry 3 -o clt.zip "$DEVECO_CLT_URL"
          unzip -q clt.zip -d clt
          clt_dir=$(find clt -maxdepth 2 -type d -name 'command-line-tools' | head -1)
          if [ -z "$clt_dir" ]; then clt_dir=$(find clt -maxdepth 2 -mindepth 1 -type d | head -1); fi
          echo "DEVECO_CLI_CLT_PATH=$(pwd)/$clt_dir" >> "$GITHUB_ENV"
        env:
          DEVECO_CLT_URL: ${{ vars.DEVECO_CLT_URL }}
      - name: Prepare CI build profile
        run: cp ci/build-profile.ci.json5 build-profile.json5
      - name: Lint
        run: |
          set -o pipefail
          devecocli check lint | tee lint_report.txt
          if grep -E "Errors:[[:space:]]*[1-9]" lint_report.txt; then
            echo "::error::Lint finished with errors (see report above)"
            exit 1
          fi

  build:
    name: Build unsigned debug HAP
    runs-on: ubuntu-latest
    if: ${{ vars.DEVECO_CLT_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DevEco CLI
        run: npm install -g @deveco/deveco-cli
      - name: Install Command Line Tools
        run: |
          curl -L --fail --retry 3 -o clt.zip "$DEVECO_CLT_URL"
          unzip -q clt.zip -d clt
          clt_dir=$(find clt -maxdepth 2 -type d -name 'command-line-tools' | head -1)
          if [ -z "$clt_dir" ]; then clt_dir=$(find clt -maxdepth 2 -mindepth 1 -type d | head -1); fi
          echo "DEVECO_CLI_CLT_PATH=$(pwd)/$clt_dir" >> "$GITHUB_ENV"
        env:
          DEVECO_CLT_URL: ${{ vars.DEVECO_CLT_URL }}
      - name: Prepare CI build profile
        run: cp ci/build-profile.ci.json5 build-profile.json5
      - name: Build
        run: devecocli build --product default --modules entry@default --build-mode debug
      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: entry-unsigned-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: warn
          retention-days: 7
