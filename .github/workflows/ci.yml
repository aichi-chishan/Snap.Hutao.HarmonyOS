name: CI

# HarmonyOS lint/build 依赖华为 Command Line Tools（华为开发者站需登录下载，无公开直链）。
# 在仓库 Settings → Secrets and variables → Actions → Variables 配置
#   DEVECO_CLT_URL = https://github.com/aichi-chishan/snap-hutao-data/releases/download/clt-26.0.0.821/clt-part-00
# 仅接受此已审核版本；更换来源/版本必须先审核并更新固定大小与 SHA-256。
# 后本工作流自动启用；未配置时两个 job 跳过（不阻塞 PR）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Offline behavior regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned host test compiler
        run: npm ci --prefix ci --ignore-scripts
      - name: Run production logic and SQLite regressions
        run: node tests/run.cjs
        env:
          TYPESCRIPT_PATH: ${{ github.workspace }}/ci/node_modules/typescript

  meta:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check invariants
        run: |
          test -f ci/build-profile.ci.json5
          test -f docs/TESTING.md
          test -f entry/src/test/LogicUnitTest.test.ets
          grep -q "logicUnitTest()" entry/src/test/List.test.ets
          grep -q "logicUnitTest" entry/src/test/List.test.ets
          # 隐私回归门禁：仓库不得含个人隐私（本机用户名 / 私人邮箱 / 本机绝对路径）
          # 注意：此处只写通用模式，禁止把真实隐私值写进本文件（那本身就是泄露）
          # 用 git grep 只扫已跟踪文件（免疫未跟踪的本地目录）
          if git grep -InE "[A-Za-z0-9._%+-]+@(qq|163|126|gmail|outlook|foxmail)\.com|[A-Za-z]:[\\\\/]Users[\\\\/]|/home/[a-z0-9_-]+/|/Users/[a-z0-9_-]+/" \
               -- '*.md' '*.ets' '*.json5' '*.yml' '*.ts'; then
            echo "::error::Privacy regression: personal info detected in tracked files"
            exit 1
          fi
          echo "invariants ok"

  lint:
    name: Lint (0 errors gate)
    runs-on: ubuntu-latest
    if: ${{ vars.DEVECO_CLT_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned AST gate compiler
        run: npm ci --prefix ci --ignore-scripts
      - name: Install verified Command Line Tools
        run: bash ci/install-clt.sh "$RUNNER_TEMP/harmonyos-clt"
        env:
          DEVECO_CLT_URL: ${{ vars.DEVECO_CLT_URL }}
      - name: Verify native ArkTS AST gate fixtures
        run: node tests/dynamic-delete-gate.cjs && node tests/lint-report-gate.cjs
      - name: Prepare unsigned CI build profile
        run: test -f build-profile.json5 || cp ci/build-profile.ci.json5 build-profile.json5
      - name: Install project dependencies
        run: ohpm install --all --cache "$OHPM_CACHE"
      - name: Native lint with fresh fail-closed evidence
        run: node ci/run-native-lint.cjs "$RUNNER_TEMP/native-lint"
      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-evidence
          path: |
            ${{ runner.temp }}/native-lint/
            ${{ runner.temp }}/harmonyos-clt/evidence/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build unsigned debug HAP
    runs-on: ubuntu-latest
    if: ${{ vars.DEVECO_CLT_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Command Line Tools
        run: bash ci/install-clt.sh "$RUNNER_TEMP/harmonyos-clt"
        env:
          DEVECO_CLT_URL: ${{ vars.DEVECO_CLT_URL }}
      - name: Prepare unsigned CI build profile
        run: test -f build-profile.json5 || cp ci/build-profile.ci.json5 build-profile.json5
      - name: Clean and build with direct Hvigor
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-build"
          ohpm install --all --cache "$OHPM_CACHE" 2>&1 | tee "$RUNNER_TEMP/native-build/ohpm.log"
          hvigorw clean --no-daemon 2>&1 | tee "$RUNNER_TEMP/native-build/clean.log"
          hvigorw assembleHap --mode module -p module=entry@default -p product=default --no-daemon 2>&1 | tee "$RUNNER_TEMP/native-build/build.log"
          grep -q 'BUILD SUCCESSFUL' "$RUNNER_TEMP/native-build/build.log"
          python3 ci/check-hap.py entry/build/default/outputs/default/entry-default-unsigned.hap > "$RUNNER_TEMP/native-build/hap.json"
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            ${{ runner.temp }}/native-build/
            ${{ runner.temp }}/harmonyos-clt/evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: entry-unsigned-hap
          path: entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 7
